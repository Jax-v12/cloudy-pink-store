name: Store cleanup and fulfillment

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: store-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up patched Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify Node.js runtime
        run: node -e "const fs = require('node:fs'); const assert = require('node:assert/strict'); assert.equal(process.versions.node, fs.readFileSync('.node-version', 'utf8').trim()); console.log(process.version);"
      - name: Run existing authenticated cron endpoints
        run: node scripts/run-store-cron.mjs
        env:
          STORE_CRON_ORIGIN: ${{ vars.STORE_CRON_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
